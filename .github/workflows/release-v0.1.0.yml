name: Fix v0.1.0 release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.0.yml

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: windows-latest
    steps:
      - name: Update release notes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          First public release of DevSpace Quick Tunnel Tray.

          This project builds on `@waishnav/devspace` and adds a lightweight Windows tray launcher plus Cloudflare Tunnel configuration for exposing a local DevSpace MCP endpoint to the ChatGPT web client.

          ## Download

          - `DevSpaceQuickTunnelTray-v0.1.0-win-x64.zip` - lightweight Windows x64 package
          - SHA256: `dc1b7b48fcb622020e07aa3035e510777e59e6432a47626de0959223adcf2b13`

          ## First run

          After extracting the ZIP, run:

          ```powershell
          powershell -ExecutionPolicy Bypass -File .\setup-runtime.ps1
          ```

          Wait for `Runtime ready.`, then start `DevSpaceQuickTunnelTray.exe`.

          The lightweight package intentionally does not bundle Node.js, cloudflared, `node_modules`, machine-specific settings, credentials, logs, or tunnel identifiers.

          ## Security

          Current audit status: **PASS WITH KNOWN UPSTREAM RISK**. The reviewed findings are in the Pi subagent dependency path, and this release forces `DEVSPACE_SUBAGENTS=0`. See `SECURITY_AUDIT.md` in the package/repository for details.

          License: MIT.
          '@ | Set-Content -Path release-notes.md -Encoding UTF8
          gh release edit v0.1.0 --repo $env:GITHUB_REPOSITORY --title 'v0.1.0' --notes-file release-notes.md
