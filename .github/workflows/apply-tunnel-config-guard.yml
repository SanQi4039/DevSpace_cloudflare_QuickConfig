name: Apply tunnel configuration guard

on:
  push:
    branches:
      - ai/tunnel-config-guard-20260901
    paths:
      - .github/workflows/apply-tunnel-config-guard.yml
      - .cloud-edit.ps1

permissions:
  contents: write

jobs:
  apply-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ai/tunnel-config-guard-20260901
          fetch-depth: 0

      - name: Preserve UTF-8 edit script and switch to main
        shell: powershell
        run: |
          Copy-Item .cloud-edit.ps1 $env:RUNNER_TEMP\cloud-edit.ps1
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $edit = [System.IO.File]::ReadAllText($env:RUNNER_TEMP + '\cloud-edit.ps1', $utf8)
          $edit = $edit.Replace('$source = Get-Content $sourcePath -Raw', '$source = [System.IO.File]::ReadAllText($sourcePath, (New-Object System.Text.UTF8Encoding($false)))')
          $edit = $edit.Replace('Set-Content $sourcePath $source -Encoding UTF8', '[System.IO.File]::WriteAllText($sourcePath, $source, (New-Object System.Text.UTF8Encoding($false)))')
          $edit = $edit.Replace('$settings = Get-Content $settingsPath -Raw', '$settings = [System.IO.File]::ReadAllText($settingsPath, (New-Object System.Text.UTF8Encoding($false)))')
          $edit = $edit.Replace('Set-Content $settingsPath $settings -Encoding UTF8', '[System.IO.File]::WriteAllText($settingsPath, $settings, (New-Object System.Text.UTF8Encoding($false)))')
          $edit = $edit.Replace('$readme = Get-Content $readmePath -Raw', '$readme = [System.IO.File]::ReadAllText($readmePath, (New-Object System.Text.UTF8Encoding($false)))')
          $edit = $edit.Replace('Set-Content $readmePath $readme -Encoding UTF8', '[System.IO.File]::WriteAllText($readmePath, $readme, (New-Object System.Text.UTF8Encoding($false)))')
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($env:RUNNER_TEMP + '\cloud-edit.ps1', $edit, $utf8Bom)
          git fetch origin main
          git checkout -B publish origin/main

      - name: Apply requested changes
        shell: powershell
        run: |
          & $env:RUNNER_TEMP\cloud-edit.ps1
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in @('DevSpaceQuickTunnelTray.cs','README.md','settings.example.json')) {
            $path = (Resolve-Path $file).Path
            $text = [System.IO.File]::ReadAllText($path, $utf8)
            $text = $text.TrimEnd("`r", "`n") + "`r`n"
            [System.IO.File]::WriteAllText($path, $text, $utf8)
          }
          git diff --check

      - name: Build on GitHub Windows runner
        shell: powershell
        run: |
          .\build.ps1
          if (-not (Test-Path .\DevSpaceQuickTunnelTray.exe)) { throw 'Build output missing.' }

      - name: Verify strict guard content and change boundary
        shell: powershell
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $source = [System.IO.File]::ReadAllText((Resolve-Path .\DevSpaceQuickTunnelTray.cs).Path, $utf8)
          foreach ($required in @(
            'TunnelMode = string.Empty',
            'ValidateStartupPrerequisites',
            'CloudflaredServiceManager.IsServiceRunning',
            'if (!ValidateStartupPrerequisites(out startupError))',
            'ControlCloudflareService("start",',
            'false, RestartTunnel)'
          )) {
            if (-not $source.Contains($required)) { throw "Strict guard marker missing: $required" }
          }
          $changed = @(git diff --name-only)
          $expected = @('DevSpaceQuickTunnelTray.cs','README.md','settings.example.json')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          foreach ($file in $expected) {
            if ($file -notin $changed) { throw "Expected changed file missing: $file" }
          }

      - name: Publish one commit to main
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DevSpaceQuickTunnelTray.cs README.md settings.example.json
          git commit -m 'Require strict Cloudflare tunnel configuration'
          git push origin HEAD:main
