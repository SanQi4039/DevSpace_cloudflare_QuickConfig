name: Apply tunnel configuration guard

on:
  push:
    branches:
      - ai/tunnel-config-guard-20260901
    paths:
      - .github/workflows/apply-tunnel-config-guard.yml
      - .cloud-edit.ps1

permissions:
  contents: write

jobs:
  apply-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ai/tunnel-config-guard-20260901
          fetch-depth: 0

      - name: Preserve edit script and switch to main
        shell: powershell
        run: |
          Copy-Item .cloud-edit.ps1 $env:RUNNER_TEMP\cloud-edit.ps1
          git fetch origin main
          git checkout -B publish origin/main

      - name: Apply requested changes
        shell: powershell
        run: |
          & $env:RUNNER_TEMP\cloud-edit.ps1
          git diff --check

      - name: Build on GitHub Windows runner
        shell: powershell
        run: |
          .\build.ps1
          if (-not (Test-Path .\DevSpaceQuickTunnelTray.exe)) { throw 'Build output missing.' }

      - name: Verify strict guard content and change boundary
        shell: powershell
        run: |
          $source = Get-Content .\DevSpaceQuickTunnelTray.cs -Raw
          foreach ($required in @(
            'TunnelMode = string.Empty',
            'ValidateStartupPrerequisites',
            'CloudflaredServiceManager.IsServiceRunning',
            'SetState("启动已阻止"',
            'ControlCloudflareService("start", "启动", false, RestartTunnel)',
            '任一条件不满足都不会启动'
          )) {
            if (-not $source.Contains($required)) { throw "Strict guard marker missing: $required" }
          }
          $changed = @(git diff --name-only)
          $expected = @('DevSpaceQuickTunnelTray.cs','README.md','settings.example.json')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          foreach ($file in $expected) {
            if ($file -notin $changed) { throw "Expected changed file missing: $file" }
          }

      - name: Publish one commit to main
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DevSpaceQuickTunnelTray.cs README.md settings.example.json
          git commit -m 'Require strict Cloudflare tunnel configuration'
          git push origin HEAD:main
