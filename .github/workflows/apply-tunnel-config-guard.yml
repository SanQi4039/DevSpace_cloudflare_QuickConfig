name: Apply tunnel configuration guard

on:
  push:
    branches:
      - ai/tunnel-config-guard-20260901
    paths:
      - .github/workflows/apply-tunnel-config-guard.yml

permissions:
  contents: write

jobs:
  apply-build-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ai/tunnel-config-guard-20260901
          fetch-depth: 0

      - name: Preserve patch and switch to main
        shell: powershell
        run: |
          Copy-Item .cloud-edit.patch $env:RUNNER_TEMP\cloud-edit.patch
          git fetch origin main
          git checkout -B publish origin/main

      - name: Apply requested changes
        shell: powershell
        run: |
          git apply --check $env:RUNNER_TEMP\cloud-edit.patch
          git apply $env:RUNNER_TEMP\cloud-edit.patch
          git diff --check

      - name: Build on GitHub Windows runner
        shell: powershell
        run: |
          .\build.ps1
          if (-not (Test-Path .\DevSpaceQuickTunnelTray.exe)) { throw 'Build output missing.' }

      - name: Verify change boundary
        shell: powershell
        run: |
          $changed = @(git diff --name-only)
          $expected = @('DevSpaceQuickTunnelTray.cs','README.md','settings.example.json')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          foreach ($file in $expected) {
            if ($file -notin $changed) { throw "Expected changed file missing: $file" }
          }

      - name: Publish one commit to main
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DevSpaceQuickTunnelTray.cs README.md settings.example.json
          git commit -m 'Require explicit Cloudflare tunnel configuration'
          git push origin HEAD:main
